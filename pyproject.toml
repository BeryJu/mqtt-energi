[project]
name = "mqtt-energi"
version = "0.1.0"
description = "Bridge myenergi device-to-device packets to MQTT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "paho-mqtt>=2,<3",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = ["env"]

[tool.ruff.format]
quote-style = "double"
